name: Awork
description: >-
  Awork (awork.ge) is a Georgian online job marketplace that connects job seekers
  with employers across Georgia. The platform lets people search and apply for vacancies
  directly, while companies post openings and manage their hiring and HR processes digitally.
  It features an AI assistant named "Argo" that helps users find relevant positions or
  publish vacancies, and offers native iOS and Android mobile apps alongside the web
  experience. Awork is backed by 500 Global. The company does not currently publish a
  public developer API, developer portal, or API documentation. Not to be confused
  with the unrelated German work-management SaaS awork.com, which does operate a developer API.
